[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snp500"
version = "0.1.0"
description = "S&P 500 Historical Constituent Intelligence Platform: point-in-time, event-sourced index membership 2001-2026"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31", "beautifulsoup4>=4.12", "lxml>=4.9", "pandas>=2.0",
  "SQLAlchemy>=2.0", "psycopg2-binary>=2.9", "fastapi>=0.110", "uvicorn>=0.29",
  "pydantic>=2.0", "pydantic-settings>=2.0", "typer>=0.12", "rich>=13",
  "tenacity>=8", "jinja2>=3.1", "PyYAML>=6.0",
]

[project.scripts]
snp500 = "snp500.cli:app"

[tool.setuptools.packages.find]
include = ["snp500*"]

[tool.setuptools.package-data]
"snp500.api" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
